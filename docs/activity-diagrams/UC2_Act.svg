990033" stroke-width="1.2"/><polyline points="533.6645956911664,2477.979339504877 537.5,2485 541.3354043088336,2477.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><text x="544.5" y="2428" font-family="Arial" font-size="11" fill="#222">Web / sơ đồ</text><polyline points="537.5,2848 537.5,2880 770.0,2880 770.0,2905" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,2897.979339504877 770.0,2905 773.8354043088336,2897.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="770.0,2373 770.0,2410 1235.0,2410 1235.0,2485" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="1231.1645956911664,2477.979339504877 1235.0,2485 1238.8354043088336,2477.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><text x="1242.0" y="2428" font-family="Arial" font-size="11" fill="#222">Mobile ngoài sơ đồ</text><polyline points="1235.0,2555 1235.0,2880 770.0,2880 770.0,2905" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,2897.979339504877 770.0,2905 773.8354043088336,2897.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="770.0,2923 770.0,2950" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,2942.979339504877 770.0,2950 773.8354043088336,2942.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="770.0,70 770.0,310 770.0,340" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,332.97933950487703 770.0,340 773.8354043088336,332.97933950487703" fill="none" stroke="#990033" stroke-width="1.2"/><ellipse cx="770.0" cy="60.0" rx="10.0" ry="10.0" fill="black" stroke="#990033"/><path d="M20,20 H316 L330,34 V120 H20 Z M316,20 V34 H330" fill="#FFFFC0" stroke="#990033"/><text x="30" y="41" font-family="Arial" font-size="12" text-anchor="start" fill="black">UC2 — Xem bản đồ và tìm tuyến trên sơ đồ</text><text x="30" y="58" font-family="Arial" font-size="12" text-anchor="start" fill="black">Activity Diagram</text><path d="M20,140 H426 L440,154 V285 H20 Z M426,140 V154 H440" fill="#FFFFC0" stroke="#990033"/><text x="30" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tác nhân: Khách tham quan (User); Admin có thể dùng như User;</text><text x="30" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">OpenStreetMap</text><text x="30" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tiền điều kiện: Có dữ liệu POI và sơ đồ; GPS trên web cần localhost hoặc</text><text x="30" y="212" font-family="Arial" font-size="12" text-anchor="start" fill="black">HTTPS và quyền vị trí.</text><path d="M1085,140 H1491 L1505,154 V285 H1085 Z M1491,140 V154 H1505" fill="#FFFFC0" stroke="#990033"/><text x="1095" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Kích hoạt: User muốn tìm POI hoặc xem tuyến tham khảo.</text><text x="1095" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Hậu điều kiện: POI được chọn; tuyến tham khảo hiển thị khi dữ liệu đồ thị</text><text x="1095" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">hỗ trợ.</text><rect x="575.0" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. User: Mở trang Khám phá; chọn bộ lọc hoặc tìm POI.</text><rect x="575.0" y="475" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="514.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Đồng bộ danh sách và marker; chỉ đưa POI có tọa độ</text><text x="770.0" y="531.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">đã xác thực hoặc có nguồn lên bản đồ địa lý.</text><polygon points="770.0,610 835.0,644.0 770.0,678 705.0,644.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="626" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Chọn kiểu bản đồ?</text><polygon points="770.0,1210 779.0,1219.0 770.0,1228 761.0,1219.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="790" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="837.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Hiển thị sơ đồ; đồng bộ tìm kiếm, bộ lọc và POI.</text><polygon points="1002.5,790 1067.5,824.0 1002.5,858 937.5,824.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="806" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Nền OSM tải được?</text><polygon points="1002.5,1135 1011.5,1144.0 1002.5,1153 993.5,1144.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="970" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1009.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Web: Leaflet/OpenStreetMap. Mobile: MapLibre. Chỉ hiển thị</text><text x="770.0" y="1026.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">marker có tọa độ hợp lệ hoặc có nguồn.</text><rect x="1040.0" y="970" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1009.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E3. Mất mạng: thông báo nền OSM chưa tải được; vẫn cho dùng sơ</text><text x="1235.0" y="1026.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">đồ/dữ liệu đã có.</text><rect x="575.0" y="1255" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1302.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. User: Chọn POI; bật GPS nếu muốn xem vị trí.</text><polygon points="770.0,1390 835.0,1424.0 770.0,1458 705.0,1424.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1406" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">User muốn bật GPS?</text><polygon points="770.0,1990 779.0,1999.0 770.0,2008 761.0,1999.0" fill="#FFFFC0" stroke="#990033"/><polygon points="537.5,1570 602.5,1604.0 537.5,1638 472.5,1604.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="1586" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có quyền và lấy được vị trí?</text><polygon points="537.5,1915 546.5,1924.0 537.5,1933 528.5,1924.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1750" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1797.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Cập nhật marker vị trí; web cần localhost/HTTPS.</text><rect x="575.0" y="1750" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1789.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Không lấy được GPS hoặc bị từ chối quyền: thông báo; vẫn xem</text><text x="770.0" y="1806.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">và chọn POI.</text><rect x="1040.0" y="1570" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1617.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tiếp tục xem POI mà không định vị.</text><rect x="575.0" y="2035" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2082.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Hiển thị chi tiết; cập nhật vị trí khi được cấp quyền.</text><rect x="575.0" y="2170" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2217.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. User: Chọn điểm xuất phát và bấm Chỉ đường.</text><polygon points="770.0,2305 835.0,2339.0 770.0,2373 705.0,2339.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2321" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Tìm tuyến theo nền tảng?</text><polygon points="770.0,2905 779.0,2914.0 770.0,2923 761.0,2914.0" fill="#FFFFC0" stroke="#990033"/><polygon points="537.5,2485 602.5,2519.0 537.5,2553 472.5,2519.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="2501" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có đường nối trong đồ thị?</text><polygon points="537.5,2830 546.5,2839.0 537.5,2848 528.5,2839.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="2665" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="2704.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B6. System: Chuyển về sơ đồ và hiển thị tuyến, khoảng cách/thời</text><text x="305.0" y="2721.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">gian ước tính nếu có đường nối.</text><rect x="575.0" y="2665" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2712.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Báo không tìm được tuyến; vẫn hiển thị POI.</text><rect x="1040.0" y="2485" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="2524.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Chỉ vẽ đường thẳng ước lượng khi dữ liệu cho phép; không</text><text x="1235.0" y="2541.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">phải tuyến đi bộ thực tế.</text><ellipse cx="770.0" cy="2964.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="2964.0" rx="8" ry="8" fill="black"/></svg>