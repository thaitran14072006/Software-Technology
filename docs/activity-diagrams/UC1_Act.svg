rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="567.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. User quét QR tham gia bằng camera điện thoại.</text><rect x="807.5" y="520" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="567.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. User mở trực tiếp URL web.</text><polygon points="770.0,730 835.0,764.0 770.0,798 705.0,764.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="746" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">URL đúng máy chủ và cổng của hệ thống?</text><polygon points="770.0,1188 779.0,1197.0 770.0,1206 761.0,1197.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="910" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="957.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Hệ thống dùng địa chỉ web hợp lệ.</text><rect x="807.5" y="910" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="949.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. QR chứa localhost/IP cũ: thông báo kiểm tra và thay bằng URL</text><text x="1002.5" y="966.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">LAN đang hoạt động.</text><ellipse cx="1002.5" cy="1059.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="1059.0" rx="8" ry="8" fill="black"/><polygon points="770.0,1233 835.0,1267.0 770.0,1301 705.0,1267.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1249" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có kết nối để tải trang và dữ liệu?</text><polygon points="770.0,1946 779.0,1955.0 770.0,1964 761.0,1955.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1413" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1460.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Hệ thống tải web và nội dung từ máy chủ.</text><polygon points="1002.5,1413 1067.5,1447.0 1002.5,1481 937.5,1447.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="1429" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Đã có gói ngoại tuyến?</text><polygon points="1002.5,1871 1011.5,1880.0 1002.5,1889 993.5,1880.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="1593" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1640.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Mở trang/gói đã tải theo UC7.</text><rect x="1040.0" y="1593" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1640.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Chưa có mạng và chưa tải gói: không mở được lần đầu.</text><ellipse cx="1235.0" cy="1742.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="1742.0" rx="8" ry="8" fill="black"/><polygon points="770.0,1991 835.0,2025.0 770.0,2059 705.0,2025.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2007" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Nền tảng sử dụng?</text><polygon points="770.0,2336 779.0,2345.0 770.0,2354 761.0,2345.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="2171" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2218.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Hiển thị trang tham quan và bộ chọn ngôn ngữ.</text><rect x="807.5" y="2171" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2218.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Mở màn hình bắt đầu của mobile; chưa có APK phát hành.</text><rect x="575.0" y="2381" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2428.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. User: Chọn Việt, Anh, Nhật, Hàn hoặc Trung.</text><rect x="575.0" y="2516" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2555.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Lưu lựa chọn; tải nội dung và đổi giao diện theo ngôn</text><text x="770.0" y="2572.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">ngữ đã chọn.</text><rect x="575.0" y="2651" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2690.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Hiển thị trang tham quan đúng ngôn ngữ; khách không cần tài</text><text x="770.0" y="2707.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">khoản.</text><ellipse cx="770.0" cy="2800.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="2800.0" rx="8" ry="8" fill="black"/></svg>