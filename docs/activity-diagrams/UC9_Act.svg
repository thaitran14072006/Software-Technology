154 V285 H20 Z M426,140 V154 H440" fill="#FFFFC0" stroke="#990033"/><text x="30" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tác nhân: Quản trị viên (Admin)</text><text x="30" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tiền điều kiện: UC8 thành công; POI và backend tồn tại; cấu hình áp</text><text x="30" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">dụng theo lần tải dữ liệu của client.</text><path d="M1550,140 H1956 L1970,154 V285 H1550 Z M1956,140 V154 H1970" fill="#FFFFC0" stroke="#990033"/><text x="1560" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Kích hoạt: Admin chuẩn bị hoặc điều chỉnh cách nhận diện POI.</text><text x="1560" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Hậu điều kiện: QR/beacon/cấu hình được lưu; không khẳng định web hỗ</text><text x="1560" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">trợ BLE.</text><rect x="807.5" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. Admin: Đăng nhập; mở công cụ cấu hình và mã tại điểm.</text><polygon points="1002.5,475 1067.5,509.0 1002.5,543 937.5,509.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="491" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có phiên ADMIN?</text><polygon points="1002.5,933 1011.5,942.0 1002.5,951 993.5,942.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Tải danh sách QR, beacon, cấu hình và trạng thái job.</text><rect x="1040.0" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Thiếu quyền: từ chối truy cập/lưu.</text><ellipse cx="1235.0" cy="804.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="804.0" rx="8" ry="8" fill="black"/><rect x="807.5" y="978" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="1017.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. Admin: Chọn bật/tắt QR hoặc beacon, đăng ký beacon, hoặc</text><text x="1002.5" y="1034.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">sửa cấu hình.</text><polygon points="1002.5,1113 1067.5,1147.0 1002.5,1181 937.5,1147.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="1129" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Loại thao tác?</text><polygon points="1002.5,1961 1011.5,1970.0 1002.5,1979 993.5,1970.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1293" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1340.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Chọn mã POI hoặc QR tham gia.</text><polygon points="537.5,1428 602.5,1462.0 537.5,1496 472.5,1462.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="1444" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Thao tác QR?</text><polygon points="537.5,1886 546.5,1895.0 537.5,1904 528.5,1895.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1608" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1647.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. Tải SVG QR; mã tham gia phải dùng URL LAN/HTTPS truy cập</text><text x="305.0" y="1664.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">được.</text><ellipse cx="305.0" cy="1757.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="305.0" cy="1757.0" rx="8" ry="8" fill="black"/><rect x="575.0" y="1608" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1655.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Chuẩn bị trạng thái mới cho QR.</text><rect x="1040.0" y="1293" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1340.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Đăng ký UUID/major/minor gắn POI hoặc bật/tắt beacon.</text><rect x="1040.0" y="1428" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1467.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Lưu ý: mobile cần beacon thật; web không quét BLE; chưa nghiệm</text><text x="1235.0" y="1484.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">thu phần cứng.</text><rect x="1505.0" y="1293" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1700.0" y="1340.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Nhập bán kính và thời gian không phát lại.</text><polygon points="1002.5,2006 1067.5,2040.0 1002.5,2074 937.5,2040.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="2022" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Quyền và dữ liệu hợp lệ?</text><polygon points="1002.5,2464 1011.5,2473.0 1002.5,2482 993.5,2473.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="2186" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2233.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Kiểm tra quyền/dữ liệu và lưu thay đổi.</text><rect x="1040.0" y="2186" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="2233.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Từ chối lưu; không thay đổi cấu hình.</text><ellipse cx="1235.0" cy="2335.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="2335.0" rx="8" ry="8" fill="black"/><polygon points="1002.5,2509 1067.5,2543.0 1002.5,2577 937.5,2543.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="2525" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">QR vừa được tắt?</text><polygon points="1002.5,2854 1011.5,2863.0 1002.5,2872 993.5,2863.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="2689" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2728.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. QR tắt bị từ chối qua API trực tuyến; bảng offline cũ chỉ thay đổi</text><text x="770.0" y="2745.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">khi tải lại.</text><rect x="1040.0" y="2689" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="2736.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Giữ trạng thái QR hiện tại.</text><rect x="807.5" y="2899" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2946.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. Admin: Tải SVG QR hoặc kiểm tra lại danh sách đã lưu.</text><rect x="807.5" y="3034" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="3081.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Kiểm tra lại danh sách; cấu hình được client nhận khi tải dữ liệu.</text><ellipse cx="1002.5" cy="3183.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="3183.0" rx="8" ry="8" fill="black"/></svg>