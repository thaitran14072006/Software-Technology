V285 H20 Z M426,140 V154 H440" fill="#FFFFC0" stroke="#990033"/><text x="30" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tác nhân: Khách tham quan (User); Admin có thể dùng như User</text><text x="30" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tiền điều kiện: Đang có mạng để tải; có dung lượng lưu và MP3 đã tạo.</text><text x="30" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">ZIP không phải bản đồ OSM ngoại tuyến đầy đủ.</text><path d="M1085,140 H1491 L1505,154 V285 H1085 Z M1491,140 V154 H1505" fill="#FFFFC0" stroke="#990033"/><text x="1095" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Kích hoạt: User chuẩn bị vào khu vực kết nối yếu hoặc muốn giữ giọng</text><text x="1095" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Google khi mất mạng.</text><text x="1095" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">Hậu điều kiện: Nội dung và MP3 đã tải dùng được ngoại tuyến; không</text><text x="1095" y="212" font-family="Arial" font-size="12" text-anchor="start" fill="black">cam kết có mọi bài hoặc mọi ngôn ngữ.</text><rect x="575.0" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. User: Chọn tải gói ngoại tuyến khi còn kết nối.</text><polygon points="770.0,475 835.0,509.0 770.0,543 705.0,509.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="491" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Đang có mạng để tải gói?</text><polygon points="770.0,933 779.0,942.0 770.0,951 761.0,942.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="694.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Đọc nội dung 5 ngôn ngữ; lấy MP3 sẵn sàng và kiểm</text><text x="537.5" y="711.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">tra file.</text><rect x="807.5" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Không tải được gói lần đầu khi chưa có mạng.</text><ellipse cx="1002.5" cy="804.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="804.0" rx="8" ry="8" fill="black"/><polygon points="770.0,978 835.0,1012.0 770.0,1046 705.0,1012.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="994" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có MP3 sẵn sàng để tải?</text><polygon points="770.0,1436 779.0,1445.0 770.0,1454 761.0,1445.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1158" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1197.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Đếm audio đã có và còn thiếu; gói có thể chưa đủ mọi bài/ngôn</text><text x="537.5" y="1214.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">ngữ.</text><rect x="807.5" y="1158" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="1205.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Báo chưa có audio Google để tải; không giả báo gói đầy đủ.</text><ellipse cx="1002.5" cy="1307.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="1307.0" rx="8" ry="8" fill="black"/><polygon points="770.0,1481 835.0,1515.0 770.0,1549 705.0,1515.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1497" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Cách lưu trên web?</text><polygon points="770.0,2329 779.0,2338.0 770.0,2347 761.0,2338.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1661" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1708.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tải và kiểm tra MIME/kích thước từng file.</text><polygon points="537.5,1796 602.5,1830.0 537.5,1864 472.5,1830.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="1812" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Tải audio thành công?</text><polygon points="537.5,2254 546.5,2263.0 537.5,2272 528.5,2263.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1976" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="2023.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Lưu dữ liệu và MP3 vào cache PWA.</text><rect x="575.0" y="1976" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2023.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Báo lỗi tải; không thay gói cũ bằng gói lỗi.</text><ellipse cx="770.0" cy="2125.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="2125.0" rx="8" ry="8" fill="black"/><rect x="1040.0" y="1661" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1708.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tải gói ZIP chứa nội dung và MP3 đã có.</text><rect x="1040.0" y="1796" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1843.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">User lưu ZIP; giải nén trước khi sử dụng.</text><rect x="575.0" y="2374" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2413.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. System: Lưu gói PWA trên localhost/HTTPS; HTTP LAN cung</text><text x="770.0" y="2430.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">cấp ZIP tải về.</text><rect x="575.0" y="2509" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2548.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. User: Nếu tải ZIP: giải nén và mở index.html; nếu PWA: mở lại</text><text x="770.0" y="2565.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">trang đã lưu.</text><polygon points="770.0,2644 835.0,2678.0 770.0,2712 705.0,2678.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2660" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Bài/ngôn ngữ đã có trong gói?</text><polygon points="770.0,2989 779.0,2998.0 770.0,3007 761.0,2998.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="2824" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2871.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. System: Hiển thị nội dung đã tải và phát đúng MP3 có trong gói.</text><rect x="807.5" y="2824" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2871.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E3. Báo thiếu bài/ngôn ngữ; không tạo Google TTS khi ngoại tuyến.</text><polygon points="770.0,3034 835.0,3068.0 770.0,3102 705.0,3068.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="3050" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Muốn nhận nội dung/audio mới?</text><rect x="342.5" y="3214" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="3261.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Kết nối mạng trở lại và tải lại gói; quay về đầu UC7.</text><ellipse cx="537.5" cy="3363.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="537.5" cy="3363.0" rx="8" ry="8" fill="black"/><ellipse cx="1002.5" cy="3228.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="3228.0" rx="8" r