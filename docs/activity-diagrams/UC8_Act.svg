"575.0" y="520" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="567.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. Admin: Mở Kết nối và nhập email, mật khẩu admin.</text><polygon points="770.0,655 835.0,689.0 770.0,723 705.0,689.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="671" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Backend kết nối được?</text><polygon points="770.0,1113 779.0,1122.0 770.0,1131 761.0,1122.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="835" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="882.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Xác thực qua backend và kiểm tra quyền ADMIN.</text><rect x="807.5" y="835" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="874.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E3. Backend không chạy hoặc lỗi kết nối: thông báo không đăng</text><text x="1002.5" y="891.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">nhập được.</text><ellipse cx="1002.5" cy="984.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="984.0" rx="8" ry="8" fill="black"/><polygon points="770.0,1158 835.0,1192.0 770.0,1226 705.0,1192.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1174" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Tài khoản/mật khẩu hợp lệ và đang hoạt</text><text x="858.0" y="1191" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">động?</text><polygon points="770.0,1616 779.0,1625.0 770.0,1634 761.0,1625.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1338" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1385.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Kiểm tra quyền ADMIN.</text><rect x="807.5" y="1338" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="1385.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Từ chối đăng nhập; không cấp phiên quản trị.</text><ellipse cx="1002.5" cy="1487.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="1487.0" rx="8" ry="8" fill="black"/><rect x="1272.5" y="520" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1467.5" y="559.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Admin dán JWT ADMIN hợp lệ; không cần nhập token khi dùng</text><text x="1467.5" y="576.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">email/mật khẩu.</text><polygon points="1002.5,1736 1067.5,1770.0 1002.5,1804 937.5,1770.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="1752" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Token còn hạn và có quyền ADMIN?</text><polygon points="1002.5,2216 1011.5,2225.0 1002.5,2234 993.5,2225.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="1916" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1955.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. System: Lưu token có được trong phiên tab; chuyển sang dữ</text><text x="770.0" y="1972.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">liệu API và mở quản trị.</text><rect x="575.0" y="2051" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2090.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Luồng email/mật khẩu có access + refresh token. JWT nhập thủ</text><text x="770.0" y="2107.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">công chỉ lưu token được cung cấp.</text><rect x="1040.0" y="1916" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1963.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Token hết hạn/thiếu quyền: yêu cầu xác thực lại hoặc từ chối.</text><ellipse cx="1235.0" cy="2065.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="2065.0" rx="8" ry="8" fill="black"/><rect x="807.5" y="2261" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2308.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. Admin: Thực hiện chức năng quản lý hoặc bấm Đăng xuất.</text><polygon points="1002.5,2396 1067.5,2430.0 1002.5,2464 937.5,2430.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="2412" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Admin chọn thao tác?</text><rect x="342.5" y="2576" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2623.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Gọi UC5/UC9/UC10; các API tiếp tục kiểm tra quyền.</text><polygon points="537.5,2711 602.5,2745.0 537.5,2779 472.5,2745.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="2727" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Phiên vẫn hợp lệ?</text><polygon points="537.5,3056 546.5,3065.0 537.5,3074 528.5,3065.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="2891" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="2938.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Thực hiện chức năng quản trị.</text><rect x="575.0" y="2891" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2938.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Yêu cầu đăng nhập lại; không thực hiện thao tác thiếu quyền.</text><ellipse cx="537.5" cy="3115.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="537.5" cy="3115.0" rx="8" ry="8" fill="black"/><rect x="1040.0" y="2576" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="2615.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Admin dùng các chức năng tham quan như User; khách không</text><text x="1235.0" y="2632.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">cần đăng nhập.</text><ellipse cx="1235.0" cy="2725.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="2725.0" rx="8" ry="8" fill="black"/><rect x="1505.0" y="2576" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1700.0" y="2615.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. System: Khi đăng xuất: thu hồi refresh token và xóa thông tin</text><text x="1700.0" y="2632.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">phiên trên trình duyệt.</text><rect x="1505.0" y="2711" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1700.0" y="2758.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Chuyển về tham quan; không còn phiên quản trị trong tab.</text><ellipse cx="1700.0" cy="2860.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1700.0" cy="2860.0" rx="8" ry="8" fill="black"/></svg>