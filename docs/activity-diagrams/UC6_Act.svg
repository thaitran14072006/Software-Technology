 x="1095" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">thông báo khi chưa thể phát.</text><rect x="575.0" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. User: Chọn POI từ danh sách, sơ đồ hoặc bản đồ.</text><rect x="575.0" y="475" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="522.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Hiển thị nội dung và trạng thái audio theo ngôn ngữ.</text><rect x="575.0" y="610" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="657.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. User: Bấm Phát thuyết minh.</text><polygon points="770.0,745 835.0,779.0 770.0,813 705.0,779.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="761" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Nguồn giọng được chọn?</text><polygon points="770.0,1961 779.0,1970.0 770.0,1979 761.0,1970.0" fill="#FFFFC0" stroke="#990033"/><polygon points="537.5,925 602.5,959.0 537.5,993 472.5,959.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="941" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có MP3 Google đúng bài và ngôn ngữ?</text><polygon points="537.5,1383 546.5,1392.0 537.5,1401 528.5,1392.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1105" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1144.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Ưu tiên MP3 Google sẵn sàng khi chạy Gemini; dùng</text><text x="305.0" y="1161.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">file đã tải nếu ngoại tuyến.</text><rect x="575.0" y="1105" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1152.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Google chưa có file: thông báo, không tự đổi giọng máy.</text><ellipse cx="770.0" cy="1254.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="1254.0" rx="8" ry="8" fill="black"/><polygon points="537.5,1428 602.5,1462.0 537.5,1496 472.5,1462.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="1444" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Đọc được file trực tuyến hoặc file đã tải?</text><polygon points="537.5,1886 546.5,1895.0 537.5,1904 528.5,1895.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1608" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1655.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Phát đúng file MP3.</text><rect x="575.0" y="1608" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1647.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1/E2. File lỗi hoặc ngoại tuyến chưa tải bài/ngôn ngữ: báo không</text><text x="770.0" y="1664.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">thể phát; không tự thay nguồn.</text><ellipse cx="770.0" cy="1757.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="1757.0" rx="8" ry="8" fill="black"/><rect x="1040.0" y="925" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="972.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. User chủ động chọn MP3 khác hoặc giọng trình duyệt trên web.</text><rect x="1040.0" y="1060" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1107.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Phát theo lựa chọn; chất lượng và ngoại tuyến tùy nguồn.</text><rect x="575.0" y="2006" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2053.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. User: Bấm Dừng hoặc chọn bài khác khi cần.</text><polygon points="770.0,2141 835.0,2175.0 770.0,2209 705.0,2175.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2157" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">User chọn bài khác?</text><rect x="342.5" y="2321" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2368.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. Dừng bài hiện tại; chọn bài/ngôn ngữ mới theo UC6.</text><ellipse cx="537.5" cy="2470.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="537.5" cy="2470.0" rx="8" ry="8" fill="black"/><ellipse cx="1002.5" cy="2335.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="2335.0" rx="8" ry="8" fill="black"/></svg>