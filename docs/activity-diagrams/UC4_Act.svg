<text x="1009.5" y="3277" font-family="Arial" font-size="11" fill="#222">Không</text><polyline points="1002.5,3404 1002.5,3474 770.0,3474 770.0,3499" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,3491.979339504877 770.0,3499 773.8354043088336,3491.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="770.0,3517 770.0,3544" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,3536.979339504877 770.0,3544 773.8354043088336,3536.979339504877" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="770.0,70 770.0,310 770.0,340" fill="none" stroke="#990033" stroke-width="1.2"/><polyline points="766.1645956911664,332.97933950487703 770.0,340 773.8354043088336,332.97933950487703" fill="none" stroke="#990033" stroke-width="1.2"/><ellipse cx="770.0" cy="60.0" rx="10.0" ry="10.0" fill="black" stroke="#990033"/><path d="M20,20 H316 L330,34 V120 H20 Z M316,20 V34 H330" fill="#FFFFC0" stroke="#990033"/><text x="30" y="41" font-family="Arial" font-size="12" text-anchor="start" fill="black">UC4 — Quét QR tại điểm tham quan</text><text x="30" y="58" font-family="Arial" font-size="12" text-anchor="start" fill="black">Activity Diagram</text><path d="M20,140 H426 L440,154 V285 H20 Z M426,140 V154 H440" fill="#FFFFC0" stroke="#990033"/><text x="30" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tác nhân: Khách tham quan (User); Admin có thể dùng như User</text><text x="30" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tiền điều kiện: Có QR hợp lệ; kết nối backend hoặc đã lưu dữ liệu POI và</text><text x="30" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">bảng QR phù hợp.</text><path d="M1085,140 H1491 L1505,154 V285 H1085 Z M1491,140 V154 H1505" fill="#FFFFC0" stroke="#990033"/><text x="1095" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Kích hoạt: User muốn mở nhanh thuyết minh của một POI.</text><text x="1095" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Hậu điều kiện: POI đúng mã được mở; chỉ phát khi audio sẵn sàng và</text><text x="1095" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">thiết bị cho phép.</text><rect x="575.0" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. User: Mở chức năng QR; chọn quét camera hoặc nhập mã.</text><polygon points="770.0,475 835.0,509.0 770.0,543 705.0,509.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="491" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Cách nhập mã?</text><polygon points="770.0,1345 779.0,1354.0 770.0,1363 761.0,1354.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Xin quyền camera nếu quét trong web và thiết bị hỗ trợ.</text><polygon points="537.5,790 602.5,824.0 537.5,858 472.5,824.0" fill="#FFFFC0" stroke="#990033"/><text x="625.5" y="806" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Camera được hỗ trợ và được cấp quyền?</text><polygon points="537.5,1270 546.5,1279.0 537.5,1288 528.5,1279.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="970" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1017.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. User: Quét hoặc dán nội dung QR của POI.</text><rect x="575.0" y="970" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1009.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Từ chối quyền/HTTP LAN/trình duyệt thiếu hỗ trợ: thông báo và</text><text x="770.0" y="1026.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">cho nhập mã.</text><rect x="575.0" y="1105" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1152.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. User nhập hoặc dán nội dung QR.</text><rect x="1040.0" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. User nhập token hoặc toàn bộ nội dung mã.</text><polygon points="770.0,1390 835.0,1424.0 770.0,1458 705.0,1424.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1406" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Loại nội dung QR?</text><polygon points="770.0,1848 779.0,1857.0 770.0,1866 761.0,1857.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1570" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1617.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Mở URL web bằng UC1; camera hệ thống có thể mở QR URL.</text><ellipse cx="537.5" cy="1719.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="537.5" cy="1719.0" rx="8" ry="8" fill="black"/><rect x="807.5" y="1570" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="1609.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A2. Ứng dụng đọc token; không mặc định camera hệ thống mở</text><text x="1002.5" y="1626.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">được sag://.</text><polygon points="770.0,1893 835.0,1927.0 770.0,1961 705.0,1927.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1909" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Tra cứu trực tuyến được?</text><polygon points="770.0,2606 779.0,2615.0 770.0,2624 761.0,2615.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="2073" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="2112.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Tra token đang hoạt động qua QR API hoặc bảng mã</text><text x="305.0" y="2129.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">đã lưu.</text><polygon points="1002.5,2073 1067.5,2107.0 1002.5,2141 937.5,2107.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="2089" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Đã lưu bảng QR và dữ liệu POI?</text><polygon points="1002.5,2531 1011.5,2540.0 1002.5,2549 993.5,2540.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="2253" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2300.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tra token trong bảng QR đã tải theo UC7.</text><rect x="1040.0" y="2253" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="2300.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E4. Ngoại tuyến chưa lưu bảng QR hoặc POI: báo thiếu dữ liệu.</text><ellipse cx="1235.0" cy="2402.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1235.0" cy="2402.0" rx="8" ry="8" fill="black"/><polygon points="770.0,2651 835.0,2685.0 770.0,2719 705.0,2685.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2667" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Token hoạt động và POI đã công bố?</text><polygon points="770.0,3109 779.0,3118.0 770.0,3127 761.0,3118.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="2831" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2878.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Chọn POI ứng với mã và ngôn ngữ hiện tại.</text><rect x="807.5" y="2831" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2878.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Mã lạ/bị tắt/POI không công bố: báo mã không hợp lệ.</text><ellipse cx="1002.5" cy="2980.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="2980.0" rx="8" ry="8" fill="black"/><polygon points="770.0,3154 835.0,3188.0 770.0,3222 705.0,3188.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="3170" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Audio sẵn sàng và thiết bị cho phép phát?</text><polygon points="770.0,3499 779.0,3508.0 770.0,3517 761.0,3508.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="3334" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="3373.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B5. System: Chọn POI đúng ngôn ngữ và yêu cầu phát audio sẵn</text><text x="537.5" y="3390.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">sàng.</text><rect x="807.5" y="3334" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="3373.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E3. Báo audio chưa sẵn sàng; nếu bị chặn phát, cho bấm Phát theo</text><text x="1002.5" y="3390.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">UC6.</text><ellipse cx="770.0" cy="3558.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="3558.0" rx="8" ry="8" fill="black"/></svg>