033"/><path d="M20,20 H316 L330,34 V120 H20 Z M316,20 V34 H330" fill="#FFFFC0" stroke="#990033"/><text x="30" y="41" font-family="Arial" font-size="12" text-anchor="start" fill="black">UC10 — Xem thống kê và nhật ký quản trị</text><text x="30" y="58" font-family="Arial" font-size="12" text-anchor="start" fill="black">Activity Diagram</text><path d="M20,140 H426 L440,154 V285 H20 Z M426,140 V154 H440" fill="#FFFFC0" stroke="#990033"/><text x="30" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tác nhân: Quản trị viên (Admin)</text><text x="30" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Tiền điều kiện: UC8 thành công; chỉ có thể thống kê các sự kiện đã được</text><text x="30" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">hệ thống ghi nhận.</text><path d="M1085,140 H1491 L1505,154 V285 H1085 Z M1491,140 V154 H1505" fill="#FFFFC0" stroke="#990033"/><text x="1095" y="161" font-family="Arial" font-size="12" text-anchor="start" fill="black">Kích hoạt: Admin muốn theo dõi sử dụng và kiểm tra lỗi vận hành.</text><text x="1095" y="178" font-family="Arial" font-size="12" text-anchor="start" fill="black">Hậu điều kiện: Admin xem dữ liệu hiện có; số liệu không đại diện đầy đủ</text><text x="1095" y="195" font-family="Arial" font-size="12" text-anchor="start" fill="black">cho mọi khách ngoài thực tế.</text><rect x="575.0" y="340" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="387.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B1. Admin: Đăng nhập và mở thống kê/công cụ quản trị.</text><polygon points="770.0,475 835.0,509.0 770.0,543 705.0,509.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="491" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có quyền ADMIN?</text><polygon points="770.0,933 779.0,942.0 770.0,951 761.0,942.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B2. System: Tải thống kê, job và nhật ký theo API tương ứng.</text><rect x="807.5" y="655" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="702.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E1. Từ chối truy cập thống kê/nhật ký.</text><ellipse cx="1002.5" cy="804.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="804.0" rx="8" ry="8" fill="black"/><polygon points="770.0,978 835.0,1012.0 770.0,1046 705.0,1012.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="994" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Tải API thành công?</text><polygon points="770.0,1436 779.0,1445.0 770.0,1454 761.0,1445.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="1158" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="1205.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B3. Admin: Chọn xem vùng có lượt ghé hoặc các bản ghi gần đây.</text><rect x="807.5" y="1158" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="1205.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E2. Lỗi mạng/backend: thông báo không tải được dữ liệu.</text><ellipse cx="1002.5" cy="1307.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="1002.5" cy="1307.0" rx="8" ry="8" fill="black"/><polygon points="770.0,1481 835.0,1515.0 770.0,1549 705.0,1515.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="1497" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Loại thông tin cần xem?</text><polygon points="770.0,2081 779.0,2090.0 770.0,2099 761.0,2090.0" fill="#FFFFC0" stroke="#990033"/><rect x="110.0" y="1661" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="305.0" y="1700.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tổng hợp sự kiện hiện diện/nghe, trạng thái TTS và nhật ký đã ghi</text><text x="305.0" y="1717.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">nhận.</text><polygon points="1002.5,1661 1067.5,1695.0 1002.5,1729 937.5,1695.0" fill="#FFFFC0" stroke="#990033"/><text x="1090.5" y="1677" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có mẫu vị trí được đồng ý chia sẻ?</text><polygon points="1002.5,2006 1011.5,2015.0 1002.5,2024 993.5,2015.0" fill="#FFFFC0" stroke="#990033"/><rect x="575.0" y="1841" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="1888.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Tổng hợp các mẫu vị trí được phép sử dụng.</text><rect x="1040.0" y="1841" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1235.0" y="1880.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">E3. Khách không đồng ý chia sẻ: không có mẫu của khách đó để</text><text x="1235.0" y="1897.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">hiển thị.</text><polygon points="770.0,2126 835.0,2160.0 770.0,2194 705.0,2160.0" fill="#FFFFC0" stroke="#990033"/><text x="858.0" y="2142" font-family="Arial" font-size="12" text-anchor="start" fill="black" font-style="italic">Có dữ liệu tương ứng?</text><polygon points="770.0,2471 779.0,2480.0 770.0,2489 761.0,2480.0" fill="#FFFFC0" stroke="#990033"/><rect x="342.5" y="2306" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="537.5" y="2345.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">B4. System: Hiển thị số liệu và heatmap tổng hợp khi có mẫu vị trí</text><text x="537.5" y="2362.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">đã được chia sẻ.</text><rect x="807.5" y="2306" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="1002.5" y="2353.5" font-family="Arial" font-size="12" text-anchor="middle" fill="black">A1. Hiển thị danh sách rỗng hoặc thông báo chưa có mẫu.</text><rect x="575.0" y="2516" width="390" height="70" rx="12" fill="#FFFFC0" stroke="#990033"/><text x="770.0" y="2555.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">Chỉ phản ánh dữ liệu đã ghi nhận; không đại diện mọi khách ngoài</text><text x="770.0" y="2572.0" font-family="Arial" font-size="12" text-anchor="middle" fill="black">thực tế.</text><ellipse cx="770.0" cy="2665.0" rx="14.0" ry="14.0" fill="white" stroke="#990033"/><ellipse cx="770.0" cy="2665.0" rx="8" ry="8" fill="black"/></svg>