<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Tien offline guide</title>
<style>@font-face{font-family:Noto;src:url(NotoSans.ttf)}body{font-family:Noto,Arial,sans-serif;margin:24px auto;padding:0 20px;max-width:760px;background:#f6f7f2;color:#214b3b}select,button{font:inherit;padding:12px;max-width:100%;margin:8px 0}select{display:block;width:100%}p{line-height:1.9}audio{width:100%}</style>
<h1 id="title"></h1><label id="languageLabel" for="language"></label><select id="language"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="zh">中文</option></select><label id="stopLabel" for="stops"></label><select id="stops"></select><p id="note"></p><h2 id="name"></h2><p id="text"></p><audio id="audio" controls preload="metadata"></audio><p id="voice"></p>
<script>const content=__GUIDE_DATA__,labels=__GUIDE_LABELS__;const $=id=>document.getElementById(id);function select(){const row=content[$('language').value][+$('stops').value];$('audio').pause();$('name').textContent=row?.name||'';$('text').textContent=row?.text||'';$('voice').textContent=row?.voice||'';if(row)$('audio').src=row.file;else $('audio').removeAttribute('src')}function language(){const lang=$('language').value,l=labels[lang];document.documentElement.lang=lang;$('title').textContent=l[0];$('languageLabel').textContent=l[1];$('stopLabel').textContent=l[2];$('note').textContent=l[5];$('stops').replaceChildren(...content[lang].map((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.name;return o}));select()}$('language').onchange=language;$('stops').onchange=select;language();</script></html>
